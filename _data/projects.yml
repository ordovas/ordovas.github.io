# Work page (/work/). Sections show in this order; items most recent first.
# `tags` must match names in `filters` (they drive the filter chips).
# Case studies are anonymised: describe the sector, never the client, and keep
# to what is already public in the CV.

filters: [GenAI, NLP, Computer vision, Deployment, Data Science]

sections:
  - id: case-studies
    title: Case studies
    intro: >-
      Some of the client work I've participated in. 
    items:
      - title: Grounded content generation for pharma
        sector: Pharmaceutical company
        years: 2025–2026
        tags: [GenAI, NLP, Deployment]
        problem: >-
          Teams needed emails, slide decks and medical documents that stay faithful
          to approved material, plus a research assistant over internal knowledge.
        approach: >-
          A research-assistant chatbot and a content generator grounded on approved
          sources, together with a second solution that reviews the generated content.
        outcome: User satisfaction around 40% higher than with the previous tools.

      - title: RAG assistant over internal knowledge
        sector: Banking
        years: 2024
        tags: [GenAI, NLP, Deployment]
        problem: >-
          Employees had to search scattered internal documentation to answer
          day-to-day questions.
        approach: >-
          A retrieval-augmented chatbot over internal data, iterated in production to
          improve answer quality.
        outcome: Adoption grew from 50 to 600 employees.

      - title: Conversational analytics for supply chain
        sector: Logistics planning
        years: 2023-2024
        tags: [GenAI]
        problem: >-
          Planners needed quick descriptive analytics over supply-chain data without
          writing queries.
        approach: >-
          A generative-AI chatbot connected to a Neo4j graph database that answers questions
          with automatic descriptive analytics and plots (PoC).
        outcome: >-
          Proof of concept developed ready for further testing and deployment 
          and to be presented to clients in logistics and supply-chain management.

      - title: Rust detection for asset maintenance
        sector: Energy
        years: 2021
        tags: [Computer vision]
        problem: >-
          Experts reviewed drone footage of petrol tanks by hand: a one-day
          inspection could take three to four days to report.
        approach: >-
          A U-Net segmentation model that finds rust down to pixel level, served
          through an API that analyses the uploaded drone video.
        outcome: >-
          About 95% accuracy, turning days of manual review into near-real-time
          reports, as part of a solution aiming to cut inspection costs by 50%.
        links:
          - label: Blog post
            url:   https://www.cognizant.com/se/en/insights/blog/articles/from-personnel-based-operations-to-ai-driven-automated-maintenance



