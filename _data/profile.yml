# One-liner under the name on the home page.
headline: >-
  Astrophysicist turned data scientist. 
  I use AI and data science to solve real-world problems, with the curiosity and rigour I learned from science. 


# Longer "About me" text (Markdown).
about: |
  I spent six years analysing X-ray and optical spectra of supermassive black holes
  before moving into industry. Today I’m a senior data science consultant at SDG
  Group, where I develop Data Science and AI solutions for companies and take on
  technical guidance and AI lead tasks. Among the projects I've been involved in, I’ve
  built RAG chatbots used in production, generative-AI assistants for logistics
  planning, computer-vision defect detection and statistical studies for clients
  in banking, life sciences, insurance, food and energy.

  That scientific background still shapes how I work: I care about getting the
  question right, measuring things honestly and communicating results succinctly to
  non-technical audiences. I’m a curious, fast learner and I enjoy mentoring juniors
  (I’ve mentored graduates in data science and computer vision and directed a Bachelor's thesis).

# Areas shown as tags next to the About text.
focus:
  - Generative AI & RAG
  - NLP
  - Computer vision
  - Statistics
  - ML deployment
  - Scientific data analysis

