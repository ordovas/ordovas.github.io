# Site settings, built natively by GitHub Pages (no Actions needed).
# Personal content lives in `_data/`; edit those files to update the site.

title:       Ignacio Ordovás Pascual
tagline:     Data Scientist, PhD
description: >-
  Personal website of Ignacio Ordovás Pascual, PhD. Data scientist in Madrid
  with a background in astrophysics. CV, projects and research.
url:         https://ordovas.github.io
baseurl:     ""
lang:        en
logo:        /assets/img/logo.png

author:
  name:  Ignacio Ordovás Pascual
  email: ignacio@ordovas-pascual.eu

# Main navigation (in order). `url` is relative to the site root.
nav:
  - title: CV
    url:   /cv/
  - title: Projects
    url:   /portfolio/
  - title: Research
    url:   /astro/
  - title: Beyond work
    url:   /miscellaneous/

# Only plugins supported by GitHub Pages.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      layout: page

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - vendor
  - .jekyll-cache
