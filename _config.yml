# Site settings, built natively by GitHub Pages (no Actions needed).
# Personal content lives in `_data/`; edit those files to update the site.

title:       Ignacio Ordovás Pascual
tagline:     Data Scientist, PhD
description: >-
  Ignacio Ordovás Pascual, PhD: senior data science consultant in Madrid working
  on generative AI, RAG, NLP and computer vision, with a background in
  astrophysics research. CV, projects and publications.
url:         https://ordovas.github.io
baseurl:     ""
lang:        en
logo:        /assets/img/profile.jpg

author:
  name:  Ignacio Ordovás Pascual
  email: ignacio@ordovas-pascual.eu

# Main navigation (in order). `url` is relative to the site root.
nav:
  - title: CV
    url:   /cv/
  - title: Projects
    url:   /portfolio/
  - title: Research
    url:   /astro/
  - title: Beyond work
    url:   /miscellaneous/

# Only plugins supported by GitHub Pages.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/og-card.jpg   # preview image for Google, LinkedIn, WhatsApp...

# Search engine ownership checks. Paste the codes from Google Search Console /
# Bing Webmaster Tools here (see README), then uncomment.
# webmaster_verifications:
#   google: XXXXXXXXXXXXXXXX
#   bing:   XXXXXXXXXXXXXXXX

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - vendor
  - .jekyll-cache
