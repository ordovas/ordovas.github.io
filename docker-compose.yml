# Local preview with the same Jekyll/plugins as GitHub Pages.
#   docker compose up      -> http://localhost:4000 (rebuilds on save)
#   docker compose down    -> stop
services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/jekyll
    command: >-
      sh -c "(bundle check || bundle install) &&
             bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - ghp-bundle:/usr/local/bundle

volumes:
  ghp-bundle:
    name: ghp-bundle   # shared gem cache, survives `down`
