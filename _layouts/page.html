---
layout: default
---
<article class="wrap page">
  <header class="page-header">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  {%- if page.banner %}
  <img class="banner" src="{{ page.banner | relative_url }}" alt="">
  {%- endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
