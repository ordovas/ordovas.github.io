<footer class="site-footer">
  <div class="spectrum" aria-hidden="true"></div>
  <div class="wrap footer-inner">
    <p>© {{ site.time | date: "%Y" }} {{ site.data.profile.name }}</p>
    <ul class="link-row">
      {%- for link in site.data.profile.links %}
      <li><a href="{{ link.url }}" aria-label="{{ link.name }}" title="{{ link.name }}"{% unless link.url contains 'mailto:' %} rel="noopener"{% endunless %}>{% include icon.html name=link.icon %}</a></li>
      {%- endfor %}
    </ul>
  </div>
</footer>
