{%- comment -%}
  schema.org Person markup for the home page, so search engines can connect the
  name with the job, education and profiles. Built from _data/profile.yml.
{%- endcomment -%}
{%- assign p = site.data.profile -%}
{%- assign email = p.links | where: "icon", "mail" | first -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": {{ site.url | append: "/#person" | jsonify }},
  "name": {{ p.name | jsonify }},
  "honorificSuffix": {{ p.honorific | jsonify }},
  "jobTitle": {{ p.role | jsonify }},
  "description": {{ site.description | jsonify }},
  "url": {{ site.url | append: "/" | jsonify }},
  "image": {{ site.url | append: p.photo | jsonify }},
  "email": {{ email.url | jsonify }},
  "address": { "@type": "PostalAddress", "addressLocality": "Madrid", "addressCountry": "ES" },
  "worksFor": { "@type": "Organization", "name": {{ p.company | jsonify }}, "url": {{ site.data.experience[0].url | jsonify }} },
  "alumniOf": [
    {%- for e in site.data.education %}
    { "@type": "EducationalOrganization", "name": {{ e.alumni_of | default: e.school | jsonify }}{% if e.url %}, "url": {{ e.url | jsonify }}{% endif %} }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ],
  "knowsAbout": {{ p.focus | jsonify }},
  "hasCredential": [
    {%- for c in site.data.skills.certifications %}
    { "@type": "EducationalOccupationalCredential", "name": {{ c.name | jsonify }}, "url": {{ c.url | jsonify }} }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ],
  "sameAs": {{ p.same_as | jsonify }}
}
</script>
